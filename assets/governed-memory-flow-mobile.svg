<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1410" viewBox="0 0 750 1410" role="img" aria-labelledby="title desc">
  <title id="title">allura governed memory flow for narrow screens</title>
  <desc id="desc">A vertical five-stage flow from captured evidence through evaluation, human review, approved knowledge, and retrieval with provenance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="750" height="1410" rx="32" fill="#F5F1E6"/>
  <text x="54" y="90" fill="#111827" font-family="Georgia, serif" font-size="48" font-weight="700">Memory that shows its work</text>
  <text x="54" y="135" fill="#475569" font-family="Arial, sans-serif" font-size="23">A visible path from evidence to approved knowledge.</text>

  <rect x="95" y="190" width="560" height="180" rx="28" fill="#FBF7ED" stroke="#1D4ED8" stroke-width="5"/>
  <circle cx="155" cy="250" r="34" fill="#1D4ED8"/>
  <text x="155" y="261" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">1</text>
  <text x="215" y="260" fill="#111827" font-family="Georgia, serif" font-size="36" font-weight="700">Capture</text>
  <text x="155" y="320" fill="#475569" font-family="Arial, sans-serif" font-size="23">Append-only evidence with actor and source.</text>
  <line x1="375" y1="370" x2="375" y2="420" stroke="#111827" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="95" y="420" width="560" height="180" rx="28" fill="#FBF7ED" stroke="#FF5A2E" stroke-width="5"/>
  <circle cx="155" cy="480" r="34" fill="#FF5A2E"/>
  <text x="155" y="491" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">2</text>
  <text x="215" y="490" fill="#111827" font-family="Georgia, serif" font-size="36" font-weight="700">Evaluate</text>
  <text x="155" y="550" fill="#475569" font-family="Arial, sans-serif" font-size="23">Score candidate value and policy eligibility.</text>
  <line x1="375" y1="600" x2="375" y2="650" stroke="#111827" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="75" y="650" width="600" height="210" rx="30" fill="#FBF7ED" stroke="#C89B3C" stroke-width="6"/>
  <circle cx="155" cy="715" r="36" fill="#C89B3C"/>
  <text x="155" y="727" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="29" font-weight="700">3</text>
  <text x="215" y="725" fill="#111827" font-family="Georgia, serif" font-size="36" font-weight="700">Human review</text>
  <text x="155" y="785" fill="#475569" font-family="Arial, sans-serif" font-size="23">Approve, defer, or reject before promotion.</text>
  <rect x="215" y="810" width="320" height="40" rx="20" fill="#157A4A"/>
  <text x="375" y="837" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="700">GOVERNANCE GATE</text>
  <line x1="375" y1="860" x2="375" y2="910" stroke="#111827" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="95" y="910" width="560" height="180" rx="28" fill="#FBF7ED" stroke="#157A4A" stroke-width="5"/>
  <circle cx="155" cy="970" r="34" fill="#157A4A"/>
  <text x="155" y="981" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">4</text>
  <text x="215" y="980" fill="#111827" font-family="Georgia, serif" font-size="36" font-weight="700">Promote</text>
  <text x="155" y="1040" fill="#475569" font-family="Arial, sans-serif" font-size="23">Versioned knowledge with audit history.</text>
  <line x1="375" y1="1090" x2="375" y2="1140" stroke="#111827" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="95" y="1140" width="560" height="180" rx="28" fill="#FBF7ED" stroke="#C89B3C" stroke-width="5"/>
  <circle cx="155" cy="1200" r="34" fill="#C89B3C"/>
  <text x="155" y="1211" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700">5</text>
  <text x="215" y="1210" fill="#111827" font-family="Georgia, serif" font-size="36" font-weight="700">Retrieve</text>
  <text x="155" y="1270" fill="#475569" font-family="Arial, sans-serif" font-size="23">Tenant-scoped context with provenance intact.</text>

  <text x="375" y="1370" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="20" font-weight="700">Evidence first · Human approval · Provenance preserved</text>
</svg>
