<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">allura governed memory flow</title>
  <desc id="desc">A five-stage flow from captured evidence through evaluation, human review, approved knowledge, and retrieval with provenance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="1600" height="760" rx="36" fill="#F5F1E6"/>
  <text x="90" y="105" fill="#111827" font-family="Georgia, serif" font-size="56" font-weight="700">Memory that shows its work</text>
  <text x="92" y="153" fill="#475569" font-family="Arial, sans-serif" font-size="24">Every reusable memory keeps a visible path back to evidence and approval.</text>
  <line x1="315" y1="370" x2="405" y2="370" stroke="#111827" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="625" y1="370" x2="715" y2="370" stroke="#111827" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="935" y1="370" x2="1025" y2="370" stroke="#111827" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1245" y1="370" x2="1335" y2="370" stroke="#111827" stroke-width="6" marker-end="url(#arrow)"/>
  <g>
    <rect x="75" y="245" width="240" height="250" rx="30" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="5"/>
    <circle cx="195" cy="315" r="34" fill="#1D4ED8"/>
    <text x="195" y="326" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">1</text>
    <text x="195" y="395" text-anchor="middle" fill="#111827" font-family="Georgia, serif" font-size="30" font-weight="700">Capture</text>
    <text x="195" y="435" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">Append-only evidence</text>
    <text x="195" y="463" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">with actor and source</text>
  </g>
  <g>
    <rect x="385" y="245" width="240" height="250" rx="30" fill="#FFFFFF" stroke="#FF5A2E" stroke-width="5"/>
    <circle cx="505" cy="315" r="34" fill="#FF5A2E"/>
    <text x="505" y="326" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">2</text>
    <text x="505" y="395" text-anchor="middle" fill="#111827" font-family="Georgia, serif" font-size="30" font-weight="700">Evaluate</text>
    <text x="505" y="435" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">Score candidate value</text>
    <text x="505" y="463" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">and policy eligibility</text>
  </g>
  <g>
    <rect x="695" y="225" width="260" height="290" rx="34" fill="#111827"/>
    <circle cx="825" cy="305" r="38" fill="#C89B3C"/>
    <text x="825" y="318" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700">3</text>
    <text x="825" y="397" text-anchor="middle" fill="#F5F1E6" font-family="Georgia, serif" font-size="32" font-weight="700">Human review</text>
    <text x="825" y="439" text-anchor="middle" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18">Approve, defer, or reject</text>
    <rect x="735" y="469" width="180" height="36" rx="18" fill="#157A4A"/>
    <text x="825" y="493" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">GOVERNANCE GATE</text>
  </g>
  <g>
    <rect x="1005" y="245" width="240" height="250" rx="30" fill="#FFFFFF" stroke="#157A4A" stroke-width="5"/>
    <circle cx="1125" cy="315" r="34" fill="#157A4A"/>
    <text x="1125" y="326" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">4</text>
    <text x="1125" y="395" text-anchor="middle" fill="#111827" font-family="Georgia, serif" font-size="30" font-weight="700">Promote</text>
    <text x="1125" y="435" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">Versioned knowledge</text>
    <text x="1125" y="463" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">with audit history</text>
  </g>
  <g>
    <rect x="1315" y="245" width="240" height="250" rx="30" fill="#FFFFFF" stroke="#C89B3C" stroke-width="5"/>
    <circle cx="1435" cy="315" r="34" fill="#C89B3C"/>
    <text x="1435" y="326" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700">5</text>
    <text x="1435" y="395" text-anchor="middle" fill="#111827" font-family="Georgia, serif" font-size="30" font-weight="700">Retrieve</text>
    <text x="1435" y="435" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">Tenant-scoped context</text>
    <text x="1435" y="463" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18">with provenance intact</text>
  </g>
  <rect x="290" y="590" width="1020" height="78" rx="39" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="800" y="638" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Evidence first · Human approval · Provenance preserved · Tenant boundaries enforced</text>
</svg>
